<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">ClipKeep</title><desc id="d">Clipboard history cards are stacked in a clean desktop workspace.</desc><defs><linearGradient id="bg"><stop stop-color="#18263c"/><stop offset="1" stop-color="#09111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><g fill="#12253a" stroke-width="2"><rect x="690" y="72" width="330" height="70" rx="12" stroke="#8fa8ff"/><rect x="735" y="116" width="330" height="70" rx="12" stroke="#62e3c1"/><rect x="780" y="160" width="330" height="70" rx="12" stroke="#8fa8ff"/></g><g fill="#edf3ff" font-family="monospace" font-size="15"><text x="730" y="114">Copied text</text><text x="775" y="158">Pinned favorite</text><text x="820" y="202">Recent item</text></g><g fill="#62e3c1"><circle cx="1040" cy="107" r="5"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle><circle cx="1085" cy="151" r="5"><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></circle></g><text x="80" y="135" fill="#edf3ff" font-family="Arial,sans-serif" font-size="58" font-weight="700">CLIPKEEP</text><text x="84" y="180" fill="#91a0ba" font-family="monospace" font-size="16" letter-spacing="4">YOUR CLIPBOARD, IN CONTROL</text><path d="M85 215H550" stroke="#62e3c1" stroke-width="3"><animate attributeName="stroke-dasharray" values="0 465;465 0" dur="4s" repeatCount="indefinite"/></path></svg>